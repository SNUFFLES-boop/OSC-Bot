appId: com.oscbot.app
productName: OSC Bot
copyright: Apache-2.0
directories:
  output: release
  buildResources: assets
files:
  - dist/**/*
  - package.json
  - "!dist/server.cjs"
asar: true
win:
  icon: assets/icon.png
  target:
    - portable
    - nsis
  artifactName: OSC-Bot-${version}-${arch}-${target}.${ext}
portable:
  artifactName: OSC-Bot-${version}-portable.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: OSC-Bot-${version}-setup.${ext}
